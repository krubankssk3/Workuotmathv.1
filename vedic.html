let curLevel = 'ป.ต้น', activeTab = 0, current = null;

function el(id){ return document.getElementById(id); }
function ri(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function numDigits(range){ const d = ri(range[0], range[1]); const lo = Math.pow(10,d-1), hi = Math.pow(10,d)-1; return ri(lo, hi); }
function spaced(n){ return String(n).split('').join('\u2009'); }
function fmt(n){ return Number(n).toLocaleString('en-US'); }
function fmtNum(val, dec){ return Number(val).toLocaleString('en-US', { minimumFractionDigits:dec, maximumFractionDigits:dec }); }
function fmtScaled(scaled, dec){ const sc = Math.pow(10,dec); const ip = Math.floor(scaled/sc), fr = scaled % sc; let s = ip.toLocaleString('en-US'); if(dec>0) s += '.' + String(fr).padStart(dec,'0'); return s; }

/* ===== generators ===== */
function genItem(it){
  if(it.type === 'add'){
    const dec = it.decimals || 0, sc = Math.pow(10, dec);
    const nums = []; let sumScaled = 0;
    for(let i=0;i<it.addends;i++){
      const ip = numDigits(it.digits);
      const fr = dec > 0 ? Math.floor(Math.random()*sc) : 0;
      sumScaled += ip*sc + fr;
      nums.push(dec > 0 ? (ip + '.' + String(fr).padStart(dec,'0')) : String(ip));
    }
    return { type:'add', nums:nums, answerText:fmtScaled(sumScaled, dec) };
  }
  if(it.type === 'sub'){
    const ad = it.aDigits || it.digits, bd = it.bDigits || it.digits;
    const cnt = it.count ? ri(it.count[0], it.count[1]) : 2;
    let terms, result, g=0;
    do{
      terms = [numDigits(ad)];
      for(let i=1;i<cnt;i++) terms.push(numDigits(bd));
      result = terms[0]; let ok=true;
      for(let i=1;i<cnt;i++){ result -= terms[i]; if(result < 0) ok=false; }
      g++;
      if(ok && result > 0) break;
    } while(g < 80);
    return { type:'sub', terms:terms, answer:result, answerText:fmtNum(result,0), tech:it.tech };
  }
  if(it.type === 'mix'){
    let terms, ans, g=0;
    do{
      terms = []; for(let i=0;i<it.terms;i++) terms.push(numDigits(it.digits));
      let run = terms[0], okp = true;
      for(let i=1;i<terms.length;i++){ run += (i%2===1 ? -terms[i] : terms[i]); if(run < 0) okp = false; }
      ans = run; g++;
      if(okp && ans > 0) break;
    } while(g < 80);
    return { type:'mix', terms:terms, answer:ans, answerText:fmtNum(ans,0), tech:it.tech };
  }
  if(it.type === 'mul'){
    const a = numDigits(it.a), b = numDigits(it.b);
    return { type:'mul', a:a, b:b, answer:a*b, answerText:fmtNum(a*b,0), tech:it.tech, blank:!!it.blank };
  }
  if(it.type === 'div'){
    const mode = it.divmode || 'exact';
    const ddLo = Math.pow(10, it.dividendDigits[0]-1), ddHi = Math.pow(10, it.dividendDigits[1])-1;
    if(mode === 'exact'){
      const qcap = it.maxQuotient || 11;
      let divisor, quotient, dividend, g=0;
      do{
        divisor = numDigits(it.divisorDigits);
        const qmin = Math.max(2, Math.ceil(ddLo/divisor)), qmax = Math.min(qcap, Math.floor(ddHi/divisor));
        quotient = qmax >= qmin ? ri(qmin, qmax) : qmin;
        dividend = divisor*quotient; g++;
      } while((dividend < ddLo || dividend > ddHi || quotient > qcap) && g < 80);
      return { type:'div', dividend:dividend, divisor:divisor, answer:quotient, answerText:String(quotient), tech:it.tech, blank:!!it.blank };
    }
    let dividend, divisor, g=0;
    do{
      dividend = numDigits(it.dividendDigits);
      divisor = numDigits(it.divisorDigits);
      g++;
    } while((divisor >= dividend || (mode === 'decimal' && dividend % divisor === 0)) && g < 80);
    if(mode === 'remainder'){
      const q = Math.floor(dividend/divisor), r = dividend % divisor;
      return { type:'div', dividend:dividend, divisor:divisor, answerText:(r > 0 ? (q + ' เศษ ' + r) : String(q)), tech:it.tech, blank:!!it.blank };
    }
    const v = Math.round(dividend/divisor*100)/100;
    return { type:'div', dividend:dividend, divisor:divisor, answerText:fmtNum(v,2), tech:it.tech, blank:!!it.blank };
  }
}

function generate(){
  const bp = BLUEPRINTS[curLevel];
  if(!bp){ alert('ระดับ "'+curLevel+'" กำลังพัฒนา'); document.querySelector('#levelSeg button[data-level="ป.ต้น"]').click(); return; }
  current = {
    level: curLevel, label: bp.label,
    books: bp.books.map(function(bk){
      return { no:bk.no, title:bk.title, minutes:bk.minutes, score:bk.score, count:bk.count,
        sections: bk.sections.map(function(sec){
          const probs = [];
          sec.items.forEach(function(it){ for(let k=0;k<it.n;k++) probs.push(genItem(it)); });
          return { no:sec.no, title:sec.title, score:sec.score, problems:probs };
        }) };
    })
  };
  renderActive();
}

/* ===== render ===== */
function headerHTML(){
  return '<div class="hdr">ข้อสอบจำลองเวทคณิต ' + current.label + '<br>' + HEADER_BY + '</div>';
}
function coverHTML(b){
  return '<div class="coverpage">' + headerHTML()
    + '<div class="cover-body">'
    + '<div class="cover-title">ฉบับที่ ' + b.no + '  ' + b.title + '</div>'
    + '<div class="cover-meta">จำนวน ' + b.count + ' ข้อ  รวม ' + b.score + ' คะแนน<br>กำหนดเวลา ' + b.minutes + ' นาที</div>'
    + '<div class="cover-name">ชื่อ-สกุล ....................................................... ชั้น ..............<br>โรงเรียน ...........................................................</div>'
    + '<div class="cover-note">(โปรดกรอกรายละเอียดข้างบน แล้วรอกรรมการให้สัญญาณเริ่มทำข้อสอบ)</div>'
    + '<div class="cover-box"><div class="row1"><div class="l">ส่งลำดับที่</div><div class="r"></div></div><div><div class="l">คะแนนที่ได้</div><div class="r"></div></div></div>'
    + '</div></div>';
}
const CREDIT = '<div class="foot pagelast">ผู้พัฒนา : นายชิติพัทธ์ นิลวรรณ ครู สพป.ศรีสะเกษ เขต 3</div>';
function renderProblem(p, num){
  if(p.type === 'add'){
    const rows = p.nums.map(function(v,idx){
      const last = idx === p.nums.length-1;
      const op = last ? '<span class="vop">+</span>' : '';
      return '<div class="vrow' + (last ? ' opr' : '') + '">' + op + '<span>' + spaced(v) + '</span></div>';
    }).join('');
    return '<div class="qbox addbox"><span class="qn">' + num + ')</span><div class="vstack">' + rows + '<div class="vline"></div><div class="sumspace"></div><div class="vline2"></div></div><div class="ans">ตอบ <span class="ansline"></span></div></div>';
  }
  let expr = '';
  if(p.type === 'sub') expr = p.terms.join(' − ');
  else if(p.type === 'mix'){ expr = String(p.terms[0]); for(let i=1;i<p.terms.length;i++) expr += (i%2===1 ? ' − ' : ' + ') + p.terms[i]; }
  else if(p.type === 'mul') expr = p.a + ' × ' + p.b;
  else if(p.type === 'div') expr = p.dividend + ' ÷ ' + p.divisor;
  return '<div class="qbox"><div class="qhead"><span class="qn">' + num + ')</span> ' + expr + ' = <span class="box"></span></div>'
    + '<div class="tech">(' + p.tech + ')</div>' + (p.blank ? '<div class="blankbox"></div>' : '<div class="dotgrid"></div>')
    + '<div class="ans">ตอบ <span class="ansline"></span></div></div>';
}
function renderBook(b){
  let html = coverHTML(b) + '<div class="pagebreak"></div>' + headerHTML();
  b.sections.forEach(function(sec){
    html += '<div class="secttitle">ตอนที่ ' + sec.no + ' ' + sec.title + ' จำนวน ' + sec.problems.length + ' ข้อ ' + sec.score + ' คะแนน</div>';
    html += '<div class="qgrid">';
    sec.problems.forEach(function(p,i){ html += renderProblem(p, i+1); });
    html += '</div>';
  });
  html += CREDIT;
  return html;
}
function renderKey(){
  let html = headerHTML() + '<div class="key-title">เฉลย</div>';
  current.books.forEach(function(b){
    html += '<div class="key-sec" style="text-decoration:underline">เฉลย ฉบับที่ ' + b.no + '  ' + b.title + '</div>';
    b.sections.forEach(function(sec){
      html += '<div class="key-sec">ตอนที่ ' + sec.no + ' ' + sec.title + '</div><div class="key-grid">';
      html += sec.problems.map(function(p,i){ return '<div class="ki"><span class="kn">' + (i+1) + ')</span><span>' + p.answerText + '</span></div>'; }).join('');
      html += '</div>';
    });
  });
  html += CREDIT;
  return html;
}
function renderActive(){
  if(!current) return;
  if(activeTab === 2){ el('doc').innerHTML = renderKey(); }
  else { el('doc').innerHTML = renderBook(current.books[activeTab]); setTimer(current.books[activeTab].minutes, activeTab); }
}

/* ===== tabs / level ===== */
document.querySelectorAll('#levelSeg button').forEach(function(b){ b.onclick = function(){
  document.querySelectorAll('#levelSeg button').forEach(function(x){ x.classList.remove('active'); });
  b.classList.add('active'); curLevel = b.dataset.level; generate();
}; });
document.querySelectorAll('#tabSeg button').forEach(function(b){ b.onclick = function(){
  document.querySelectorAll('#tabSeg button').forEach(function(x){ x.classList.remove('active'); });
  b.classList.add('active'); activeTab = +b.dataset.tab; renderActive();
}; });

/* ===== timer ===== */
let tTotal = 1500, tLeft = 1500, tRun = false, tInt = null;
function pad(n){ return (n<10?'0':'') + n; }
function mmss(s){ s=Math.max(0,Math.floor(s)); return pad(Math.floor(s/60)) + ':' + pad(s%60); }
function setTimer(minutes, tab){ tStop(); tTotal = minutes*60; tLeft = tTotal; el('tLabel').textContent = 'ฉบับที่ ' + (tab+1) + ' · ' + minutes + ' นาที'; tDraw(); }
function tDraw(){ el('timerDisp').textContent = mmss(tLeft); el('usedDisp').textContent = mmss(tTotal - tLeft); }
function tStart(){ if(tRun) return; tRun = true; el('tBtn').textContent = 'หยุด'; tInt = setInterval(function(){ tLeft = Math.max(0, tLeft-1); tDraw(); if(tLeft<=0) tStop(); }, 1000); }
function tStop(){ tRun = false; clearInterval(tInt); el('tBtn').textContent = 'เริ่ม'; }
function tToggle(){ tRun ? tStop() : tStart(); }
function tReset(){ tStop(); tLeft = tTotal; tDraw(); }

/* ===== API + record ===== */
async function api(action, data, post){
  if(!API) return null;
  try{
    if(post){ const res=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action:action},data||{}))}); return await res.json(); }
    let url=API+'?action='+encodeURIComponent(action);
    if(data) Object.keys(data).forEach(function(k){ url+='&'+encodeURIComponent(k)+'='+encodeURIComponent(data[k]); });
    const res=await fetch(url); return await res.json();
  }catch(e){ console.warn('api error:',e); return null; }
}
async function loadStudents(){
  if(!API) return;
  const st = await api('listStudents');
  if(st && st.ok && st.students){ el('studentList').innerHTML = st.students.map(function(s){ return '<option value="'+s.fullName+'">'; }).join(''); }
}
async function saveScore(){
  const name = el('rName').value.trim(); const msg = el('saveMsg');
  if(!name){ msg.style.color='var(--miss)'; msg.textContent='กรุณากรอกชื่อนักเรียน'; return; }
  if(!API){ msg.style.color='var(--miss)'; msg.textContent='ยังไม่ได้ตั้งค่า API ใน config.js'; return; }
  const score = Math.max(0, Math.min(100, parseInt(el('rScore').value,10)||0));
  const used = (parseInt(el('rMin').value,10)||0)*60 + (parseInt(el('rSec').value,10)||0);
  const btn = el('saveBtn'); btn.disabled = true; msg.style.color='var(--muted)'; msg.textContent='กำลังบันทึก...';
  const res = await api('saveSession', {
    studentName:name, level:curLevel, round:1, mode:'เวทคณิต',
    totalQuestions:50, good:0, near:0, miss:0, score:score, maxScore:100, timeSec:used
  }, true);
  btn.disabled = false;
  if(res && res.ok){ msg.style.color='var(--good)'; msg.textContent='บันทึกแล้ว ✓ ('+res.pct+'%)'; }
  else { msg.style.color='var(--miss)'; msg.textContent=(res&&res.error)?res.error:'บันทึกไม่สำเร็จ'; }
}

generate();
document.addEventListener('DOMContentLoaded', loadStudents);
</script>
